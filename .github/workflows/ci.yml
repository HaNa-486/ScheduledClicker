name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - name: Core tests
        shell: pwsh
        run: .\.artifacts\tests\SchedulerCoreTests.exe
      - name: Verify executable exists
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath .\dist\ScheduledClicker.exe)) { throw 'Windows executable was not produced.' }

  macos:
    name: macOS universal build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build, test, ad-hoc sign, and package
        run: bash ./build-macos.sh
      - name: Inspect executable architectures
        run: lipo -archs .artifacts/macos/ScheduledClicker.app/Contents/MacOS/ScheduledClicker
      - name: Upload macOS application
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ScheduledClicker-macOS-universal
          path: |
            dist/ScheduledClicker-macOS-universal.zip
            dist/ScheduledClicker-macOS-universal.sha256
          if-no-files-found: error
